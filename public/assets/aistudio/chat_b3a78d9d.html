<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>SomoChat - Offline P2P Chat</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Manrope:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#140f24; --panel:rgba(30,22,52,.62); --line:rgba(255,255,255,.12);
  --text:#efeaff; --muted:#9d93c4; --you1:#ffb347; --you2:#ff6f91; --peer:#35e0c8; --peerd:#139c8a;
  --glow:#7b5cff;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:'Manrope',system-ui,sans-serif;background:radial-gradient(120% 100% at 50% 0%,#241a44 0%,var(--bg) 60%);color:var(--text);overflow:hidden}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0}
.stage{position:relative;z-index:1;height:100%;display:grid;place-items:center;padding:max(14px,env(safe-area-inset-top)) 14px max(14px,env(safe-area-inset-bottom));perspective:1400px}
.card{width:min(760px,100%);transform-style:preserve-3d;transition:transform .25s ease-out;will-change:transform}
.glass{background:var(--panel);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:26px;box-shadow:0 40px 80px -20px rgba(0,0,0,.65),0 0 0 1px rgba(123,92,255,.12) inset,0 0 70px -20px var(--glow)}
h1,h2{font-family:'Unbounded',sans-serif;font-weight:700;letter-spacing:-.02em}

/* 3D cube logo */
.cube-wrap{width:64px;height:64px;perspective:400px;flex:none}
.cube{position:relative;width:100%;height:100%;transform-style:preserve-3d;animation:spin 9s linear infinite}
.cube i{position:absolute;inset:0;border-radius:10px;border:1.5px solid rgba(255,255,255,.55);background:linear-gradient(135deg,rgba(123,92,255,.55),rgba(255,111,145,.35));backdrop-filter:blur(2px);transition:background .6s,border-color .6s}
.cube i:nth-child(1){transform:translateZ(32px)}
.cube i:nth-child(2){transform:rotateY(180deg) translateZ(32px)}
.cube i:nth-child(3){transform:rotateY(90deg) translateZ(32px)}
.cube i:nth-child(4){transform:rotateY(-90deg) translateZ(32px)}
.cube i:nth-child(5){transform:rotateX(90deg) translateZ(32px)}
.cube i:nth-child(6){transform:rotateX(-90deg) translateZ(32px)}
.cube::after{content:"";position:absolute;left:50%;top:50%;width:18px;height:18px;margin:-9px;border-radius:50%;background:#fff;box-shadow:0 0 24px 8px var(--glow);transition:background .6s,box-shadow .6s}
.linked .cube i{background:linear-gradient(135deg,rgba(53,224,200,.6),rgba(19,156,138,.3));border-color:#aaf7ea}
.linked .cube::after{background:var(--peer);box-shadow:0 0 28px 10px var(--peer)}
@keyframes spin{from{transform:rotateX(-22deg) rotateY(0)}to{transform:rotateX(-22deg) rotateY(360deg)}}
.mini .cube-wrap{width:40px;height:40px}
.mini .cube i:nth-child(1){transform:translateZ(20px)}.mini .cube i:nth-child(2){transform:rotateY(180deg) translateZ(20px)}
.mini .cube i:nth-child(3){transform:rotateY(90deg) translateZ(20px)}.mini .cube i:nth-child(4){transform:rotateY(-90deg) translateZ(20px)}
.mini .cube i:nth-child(5){transform:rotateX(90deg) translateZ(20px)}.mini .cube i:nth-child(6){transform:rotateX(-90deg) translateZ(20px)}
.mini .cube::after{width:12px;height:12px;margin:-6px}

/* login */
#login{padding:44px 30px 36px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:18px;max-width:440px;margin:0 auto;animation:rise 1s cubic-bezier(.2,.8,.2,1) both}
#login .cube-wrap{width:96px;height:96px;margin-bottom:10px}
#login .cube i:nth-child(1){transform:translateZ(48px)}#login .cube i:nth-child(2){transform:rotateY(180deg) translateZ(48px)}
#login .cube i:nth-child(3){transform:rotateY(90deg) translateZ(48px)}#login .cube i:nth-child(4){transform:rotateY(-90deg) translateZ(48px)}
#login .cube i:nth-child(5){transform:rotateX(90deg) translateZ(48px)}#login .cube i:nth-child(6){transform:rotateX(-90deg) translateZ(48px)}
#login h1{font-size:clamp(28px,7vw,40px)}
#login p{color:var(--muted);font-size:15px;line-height:1.5;max-width:30ch}
@keyframes rise{from{opacity:0;transform:translateZ(-300px) rotateX(24deg)}to{opacity:1;transform:none}}

input{font:inherit;color:var(--text);background:rgba(10,6,24,.55);border:1px solid var(--line);border-radius:14px;padding:13px 16px;width:100%;outline:none;transition:border-color .2s,box-shadow .2s}
input::placeholder{color:#7d739f}
input:focus-visible{border-color:var(--glow);box-shadow:0 0 0 3px rgba(123,92,255,.35)}
button{font:inherit;font-weight:600;color:#1a1020;border:0;border-radius:14px;padding:13px 20px;cursor:pointer;background:linear-gradient(135deg,var(--you1),var(--you2));box-shadow:0 8px 22px -8px var(--you2);transition:transform .15s,box-shadow .15s;white-space:nowrap}
button:hover{transform:translateY(-2px) translateZ(20px);box-shadow:0 14px 28px -8px var(--you2)}
button:active{transform:translateY(1px) scale(.97)}
button:focus-visible{outline:3px solid #fff;outline-offset:2px}
button.ghost{background:rgba(255,255,255,.08);color:var(--text);box-shadow:none;border:1px solid var(--line)}
#login button{width:100%}

/* chat */
#chat{display:none;height:min(86vh,720px);flex-direction:column;overflow:hidden;animation:rise .9s cubic-bezier(.2,.8,.2,1) both}
.top{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line)}
.top h2{font-size:16px}
.status{font-size:13px;color:var(--muted);margin-top:2px}
.linked .status{color:var(--peer)}
.top .sp{flex:1}
#messages{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:12px;perspective:900px;scroll-behavior:smooth}
#messages:empty::before{content:"Link a friend below, then say hi.";margin:auto;color:var(--muted);font-size:14px}
.message{max-width:78%;padding:10px 14px 8px;border-radius:20px;line-height:1.45;font-size:15px;word-wrap:break-word;overflow-wrap:anywhere;transform-origin:50% 100%;animation:pop .6s cubic-bezier(.2,1.1,.3,1) both;transition:transform .25s}
.message:hover{transform:rotateX(6deg) translateZ(14px)}
.message .who{display:block;font-size:12px;font-weight:600;opacity:.75;margin-bottom:2px}
.message time{display:block;font-size:11px;opacity:.6;margin-top:3px}
.message.you{align-self:flex-end;color:#2a1020;background:linear-gradient(135deg,var(--you1),var(--you2));border-bottom-right-radius:6px;box-shadow:8px 14px 24px -12px rgba(255,111,145,.7);text-align:left}
.message.peer{align-self:flex-start;color:#04231f;background:linear-gradient(135deg,var(--peer),#7ff3e1);border-bottom-left-radius:6px;box-shadow:-8px 14px 24px -12px rgba(53,224,200,.6)}
.message.you{--from:40px}.message.peer{--from:-40px}
@keyframes pop{from{opacity:0;transform:translate3d(var(--from),30px,-260px) rotateX(-55deg) rotateY(calc(var(--from)/-2))}to{opacity:1;transform:none}}
#typing{display:none;align-self:flex-start;margin:0 18px 6px;gap:5px;padding:10px 14px;border-radius:16px;background:rgba(255,255,255,.08)}
#typing.on{display:flex}
#typing b{width:7px;height:7px;border-radius:50%;background:var(--peer);animation:bounce 1s infinite}
#typing b:nth-child(2){animation-delay:.15s}#typing b:nth-child(3){animation-delay:.3s}
@keyframes bounce{0%,100%{transform:translateY(0) translateZ(0);opacity:.5}50%{transform:translateY(-6px) translateZ(12px);opacity:1}}
.send{display:flex;gap:10px;padding:12px 14px;border-top:1px solid var(--line)}
#peer-section{display:none;padding:14px 18px;border-top:1px solid var(--line);background:rgba(10,6,24,.35)}
#peer-section.open{display:block;animation:rise .5s both}
#peer-section p{font-size:13px;color:var(--muted);margin-bottom:8px}
#your-peer-id{color:var(--text);font-weight:600;word-break:break-all;user-select:all}
.row{display:flex;gap:10px;margin-top:8px}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,30px);opacity:0;z-index:5;padding:10px 18px;border-radius:999px;background:#241a44;border:1px solid var(--line);font-size:14px;transition:.35s;pointer-events:none}
#toast.on{opacity:1;transform:translate(-50%,0)}
/* 3D cartoon mascot */
#stage3d{position:relative;height:136px;flex:none;perspective:700px;border-bottom:1px solid var(--line);background:radial-gradient(60% 130% at 50% 100%,rgba(123,92,255,.3),transparent 70%);overflow:hidden;display:grid;place-items:center}
#mascot{position:relative;width:76px;height:76px;margin-top:20px;transform-style:preserve-3d;animation:bob 2.6s ease-in-out infinite}
#mascot[class*="m-"]{animation-iteration-count:1}
.tilt{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .15s}
.body{position:absolute;inset:0;border-radius:50% 50% 46% 46%;transform-style:preserve-3d;background:radial-gradient(circle at 32% 24%,rgba(255,255,255,.75) 0,rgba(255,255,255,0) 26%),radial-gradient(circle at 50% 62%,#ffd27a,#ff8fb1 72%,#c45bd8);box-shadow:inset -10px -14px 22px rgba(120,30,120,.45),inset 8px 8px 16px rgba(255,255,255,.45),0 20px 30px -12px rgba(0,0,0,.65)}
.ear{position:absolute;top:-9px;width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe3a0,#ff8fb1 80%);transform:translateZ(-10px);box-shadow:inset -4px -5px 8px rgba(120,30,120,.4)}
.ear.l{left:2px}.ear.r{right:2px}
.arm{position:absolute;top:52%;width:14px;height:30px;border-radius:50%;background:linear-gradient(#ff8fb1,#c45bd8);transform-origin:50% 8%;transform:translateZ(-4px) rotate(var(--a));box-shadow:inset -3px -4px 6px rgba(120,30,120,.4)}
.arm.l{left:-9px;--a:18deg}.arm.r{right:-9px;--a:-18deg}
.eyes{position:absolute;top:30%;left:0;right:0;display:flex;justify-content:center;gap:12px;transform:translateZ(22px)}
.eye{position:relative;width:18px;height:22px;border-radius:50%;background:#fff;overflow:hidden;box-shadow:inset 0 -3px 5px rgba(0,0,0,.18);animation:blink 4.6s infinite}
.eye i{position:absolute;left:50%;top:50%;width:9px;height:12px;margin:-6px 0 0 -4.5px;border-radius:50%;background:#2a1240;transform:translate(var(--px,0px),var(--py,0px))}
.eye i::after{content:"";position:absolute;left:1.5px;top:2px;width:3px;height:3px;border-radius:50%;background:#fff}
.cheek{position:absolute;top:56%;width:11px;height:7px;border-radius:50%;background:rgba(255,70,120,.45);transform:translateZ(18px)}
.cheek.l{left:12%}.cheek.r{right:12%}
.mouth{position:absolute;left:50%;top:59%;width:20px;height:10px;margin-left:-10px;border-bottom:3px solid #4a1d3a;border-radius:0 0 20px 20px;transform:translateZ(22px);transition:all .18s}
#shadow{position:absolute;bottom:8px;width:64px;height:10px;border-radius:50%;background:rgba(0,0,0,.45);filter:blur(4px)}
.laugh .mouth{width:28px;height:16px;margin-left:-14px;border:0;background:#5a1030;border-radius:0 0 28px 28px}
.wow .mouth{width:13px;height:16px;margin-left:-6.5px;border:0;background:#5a1030;border-radius:50%}
.sad .mouth{border-bottom:0;border-top:3px solid #4a1d3a;border-radius:20px 20px 0 0;top:66%}
.angry .mouth{height:0;border-radius:0;width:18px;margin-left:-9px}
.angry .body{filter:saturate(1.5) hue-rotate(-28deg)}
.love .eye{background:transparent;box-shadow:none}.love .eye i{display:none}
.love .eye::after{content:"\2665";position:absolute;inset:0;font-size:24px;line-height:22px;text-align:center;color:#e8165a;animation:beat .45s infinite}
.m-jump .arm.r,.m-spin .arm.r{animation:wave .35s 3}
@keyframes bob{0%,100%{transform:translateY(0) scale(1,1)}50%{transform:translateY(-5px) scale(.98,1.04)}}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
@keyframes beat{50%{transform:scale(1.3)}}
@keyframes wave{50%{transform:translateZ(-4px) rotate(-120deg)}}
.m-jump{animation:jump .95s cubic-bezier(.3,0,.3,1)!important}
@keyframes jump{0%{transform:scale(1,1)}12%{transform:translateY(4px) scale(1.18,.8)}40%{transform:translateY(-52px) scale(.9,1.16)}60%{transform:translateY(-52px) scale(.92,1.12)}82%{transform:translateY(0) scale(1.2,.78)}100%{transform:scale(1,1)}}
.m-spin{animation:spin3 1.1s cubic-bezier(.3,0,.3,1)!important}
@keyframes spin3{0%{transform:translateY(0) rotateY(0)}40%{transform:translateY(-44px) rotateY(360deg) scale(1.08)}100%{transform:translateY(0) rotateY(720deg)}}
.m-shake{animation:shake .7s!important}
@keyframes shake{0%,100%{transform:translateX(0) rotateZ(0)}15%{transform:translateX(-10px) rotateZ(-6deg)}30%{transform:translateX(10px) rotateZ(6deg)}45%{transform:translateX(-8px) rotateZ(-4deg)}60%{transform:translateX(8px) rotateZ(4deg)}80%{transform:translateX(-3px)}}
.m-wobble{animation:wobble 1s ease-in-out!important}
@keyframes wobble{0%,100%{transform:rotateZ(0)}20%{transform:rotateZ(-14deg) translateY(-8px)}40%{transform:rotateZ(12deg) translateY(-12px)}60%{transform:rotateZ(-9deg) translateY(-6px)}80%{transform:rotateZ(5deg)}}
.m-sad{animation:sadm 1.6s ease-in-out!important}
@keyframes sadm{0%,100%{transform:scale(1,1)}25%,75%{transform:translateY(8px) scale(1.06,.86) rotateZ(-4deg)}}
#bursts{position:absolute;inset:0;pointer-events:none;transform-style:preserve-3d}
.burst{position:absolute;left:50%;top:58%;margin:-14px 0 0 -14px;font-size:28px;line-height:1;animation:fly 1.8s cubic-bezier(.2,.7,.3,1) forwards}
@keyframes fly{0%{opacity:0;transform:translate3d(0,0,0) scale(.3) rotateY(0)}15%{opacity:1}100%{opacity:0;transform:translate3d(var(--dx),var(--dy),var(--dz)) scale(1.5) rotateY(var(--rot))}}
#say{position:absolute;right:14px;top:12px;max-width:46%;padding:7px 12px;border-radius:14px 14px 4px 14px;background:rgba(255,255,255,.95);color:#2a1240;font-size:13px;font-weight:600;opacity:0;transform:translateY(8px) rotateX(-40deg);transform-origin:50% 100%;transition:opacity .25s,transform .35s cubic-bezier(.2,1.2,.3,1);pointer-events:none}
#say.on{opacity:1;transform:none}
#emojis{display:flex;gap:6px;padding:8px 14px 0;overflow-x:auto;scrollbar-width:none;align-items:center}
#emojis::-webkit-scrollbar{display:none}
.em{flex:none;padding:6px 10px;border-radius:12px;font-size:20px;line-height:1;color:var(--text);background:rgba(255,255,255,.08);border:1px solid var(--line);box-shadow:none}
.em:hover{transform:translateY(-4px) scale(1.15);box-shadow:none}
.em.tool{font-size:15px;font-weight:600}
.edit .em:not(.tool){border-color:#ff6f91;animation:jig .35s infinite alternate}
.edit .em:not(.tool)::after{content:"\00d7";font-size:13px;margin-left:4px;color:#ff6f91}
@keyframes jig{from{transform:rotate(-4deg)}to{transform:rotate(4deg)}}
#callbar{display:none;align-items:center;gap:10px;padding:10px 18px;border-bottom:1px solid var(--line);background:linear-gradient(90deg,rgba(53,224,200,.2),rgba(123,92,255,.2));font-size:14px;font-weight:600}
#callbar.on{display:flex;animation:rise .5s both}
#callbar span{flex:1}
#callbar button{padding:8px 14px;font-size:13px}
.tick{margin-left:4px;letter-spacing:-2px}
.tick.d{font-weight:800;color:#0b6b5d}
.mouth{height:calc(10px + var(--talk,0)*16px);background:rgba(90,16,48,calc(var(--talk,0)*1.3))}
@media(max-height:680px){#stage3d{height:100px}#mascot{transform:scale(.7);margin-top:10px}}
@media(max-width:520px){.message{max-width:88%}.send button{padding:13px 16px}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}.cube{animation:none}}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div class="stage">
  <div class="card" id="card">

    <section id="login" class="glass">
      <div class="cube-wrap"><div class="cube"><i></i><i></i><i></i><i></i><i></i><i></i></div></div>
      <h1>SomoChat</h1>
      <p>Chat directly with a friend. No server, no account.</p>
      <input type="text" id="username" placeholder="Choose a username" maxlength="24" autocomplete="off">
      <button onclick="registerUser()">Start chatting</button>
    </section>

    <section id="chat" class="glass" aria-label="Chat">
      <div class="top mini" id="top">
        <div class="cube-wrap"><div class="cube"><i></i><i></i><i></i><i></i><i></i><i></i></div></div>
        <div>
          <h2>Hi, <span id="display-username"></span></h2>
          <div class="status" id="status">Not linked yet</div>
        </div>
        <span class="sp"></span>
        <button class="ghost" onclick="startCall()">Call</button>
        <button class="ghost" onclick="togglePeer()">Link</button>
      </div>
      <div id="callbar"><span id="calltxt"></span><button id="ansbtn" onclick="answerCall()">Answer</button><button class="ghost" id="mutebtn" onclick="toggleMute()">Mute</button><button class="ghost" onclick="endCall()">End</button></div>
      <div id="stage3d" aria-hidden="true">
        <div id="shadow"></div>
        <div id="mascot">
          <div class="tilt" id="tilt">
            <div class="body">
              <span class="ear l"></span><span class="ear r"></span>
              <span class="arm l"></span><span class="arm r"></span>
              <div class="eyes"><span class="eye"><i></i></span><span class="eye"><i></i></span></div>
              <span class="cheek l"></span><span class="cheek r"></span>
              <div class="mouth"></div>
            </div>
          </div>
        </div>
        <div id="bursts"></div>
        <div id="say"></div>
      </div>
      <div id="messages" aria-live="polite"></div>
      <div id="typing" aria-hidden="true"><b></b><b></b><b></b></div>
      <div id="peer-section">
        <p>Your Peer ID: <span id="your-peer-id">Generating...</span></p>
        <div class="row">
          <button class="ghost" onclick="copyId()">Copy my ID</button>
          <button class="ghost" onclick="clearChat()">Clear chat</button>
        </div>
        <div class="row">
          <input type="text" id="remote-peer-id" placeholder="Paste friend's Peer ID" autocomplete="off">
          <button onclick="connectToPeer()">Connect</button>
        </div>
      </div>
      <div id="emojis" aria-label="Reactions"></div>
      <div class="send">
        <input type="text" id="message-input" placeholder="Type a message" autocomplete="off">
        <button onclick="sendMessage()">Send</button>
      </div>
    </section>

  </div>
</div>
<div id="toast"></div>

<script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
<script>
let username = '';
let messages = [];
let peer, conn, typingTimer, lastTypingSent = 0;
const $ = id => document.getElementById(id);

/* ---------- 3D starfield (perspective tunnel, warps on every message) ---------- */
const cv = $('bg'), cx = cv.getContext('2d');
let W, H, stars = [], warp = 0;
function resize(){ W = cv.width = innerWidth; H = cv.height = innerHeight; }
addEventListener('resize', resize); resize();
for (let i = 0; i < 260; i++) stars.push({x:(Math.random()-.5)*2400, y:(Math.random()-.5)*2400, z:Math.random()*1200, h:Math.random()<.5?265:170});
const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
function frame(){
  cx.clearRect(0,0,W,H);
  warp *= .94;
  const sp = 1.2 + warp * 26;
  for (const s of stars){
    const pz = s.z; s.z -= sp;
    if (s.z < 1){ s.x=(Math.random()-.5)*2400; s.y=(Math.random()-.5)*2400; s.z=1200; continue; }
    const k = 520 / s.z, x = W/2 + s.x*k, y = H/2 + s.y*k;
    const k2 = 520 / pz, x2 = W/2 + s.x*k2, y2 = H/2 + s.y*k2;
    const a = 1 - s.z/1200;
    cx.strokeStyle = `hsla(${s.h},90%,75%,${a})`;
    cx.lineWidth = Math.max(.6, a*2.2);
    cx.beginPath(); cx.moveTo(x2,y2); cx.lineTo(x,y); cx.stroke();
  }
  if (!still) requestAnimationFrame(frame);
}
frame();

/* ---------- tilt the whole card toward the pointer ---------- */
const card = $('card');
addEventListener('pointermove', e => {
  if (still) return;
  const rx = (.5 - e.clientY/innerHeight) * 7, ry = (e.clientX/innerWidth - .5) * 9;
  card.style.transform = `rotateX(${rx}deg) rotateY(${ry}deg)`;
});
addEventListener('pointerleave', () => card.style.transform = '');

/* ---------- helpers ---------- */
function toast(t){ const el=$('toast'); el.textContent=t; el.classList.add('on'); clearTimeout(toast.t); toast.t=setTimeout(()=>el.classList.remove('on'),2200); }
let linked = false;
function updateStatus(){
  const q = messages.filter(m => m.isYou && m.status === 'queued').length;
  $('status').textContent = (navigator.onLine ? 'Online' : 'Offline') + ' · ' + (linked ? 'Linked' : 'Not linked') + (q ? ' · ' + q + ' pending' : '');
}
function setLinked(on){ linked = on; document.body.classList.toggle('linked', on); updateStatus(); }
function togglePeer(){ $('peer-section').classList.toggle('open'); }
function copyId(){
  if (!peer || !peer.open){ toast('ID abhi bani nahi'); return; }
  const id = peer.id;
  (navigator.clipboard ? navigator.clipboard.writeText(id) : Promise.reject()).then(() => toast('Peer ID copied')).catch(() => toast('ID select karke copy karo'));
}

/* ---------- app ---------- */
function registerUser(){
  username = $('username').value.trim();
  if (!username){ toast('Enter a username first'); return; }
  $('login').style.display = 'none';
  $('chat').style.display = 'flex';
  $('display-username').textContent = username;
  messages = [];
  localStorage.removeItem('chitchat_messages');
  renderMessages();
  initializePeer();
  updateStatus();
  try { if (window.Notification && Notification.permission === 'default') Notification.requestPermission(); } catch(e){}
  $('message-input').focus();
  setTimeout(() => react('👋', true, username, 'Namaste ' + username + '! 👋'), 900);
}

function bindConn(c){
  conn = c;
  c.on('open', () => { lastPeer = c.peer; flushQueue(); setLinked(true); toast('Linked with your friend'); $('peer-section').classList.remove('open'); react('🎉', false, 'Dost', 'Dost mil gaya! 🎉'); });
  c.on('data', d => {
    if (d && d.type === 'typing'){ showTyping(); return; }
    if (d && d.type === 'react'){ react(d.emoji, false, d.username); return; }
    if (d && d.type === 'ack'){ setStatus(d.id, 'delivered'); return; }
    if (d && d.message){ hideTyping(); gotMessage(d, id => c.send({type:'ack', id})); }
  });
  c.on('close', () => { if (conn === c && linked){ setLinked(false); toast('Friend disconnected, messages queue honge'); } });
  c.on('error', () => toast('Connection problem'));
}

const LIBS = ['https://cdn.jsdelivr.net/npm/peerjs@1.4.7/dist/peerjs.min.js', 'https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.4.7/peerjs.min.js'];
const ICE = {iceServers:[{urls:'stun:stun.l.google.com:19302'}, {urls:'stun:stun1.l.google.com:19302'}, {urls:'stun:global.stun.twilio.com:3478'}]};
let peerTry = 0, peerTimer;
function setPeerId(t){ $('your-peer-id').textContent = t; }
function loadPeerLib(i, done){
  if (window.Peer) return done(true);
  if (i >= LIBS.length) return done(false);
  const sc = document.createElement('script'); sc.src = LIBS[i];
  sc.onload = () => done(!!window.Peer); sc.onerror = () => loadPeerLib(i + 1, done);
  document.head.appendChild(sc);
}
function retryPeer(msg){
  peerTry++;
  const wait = Math.min(15000, 2000 * peerTry);
  setPeerId(msg + ' · ' + Math.round(wait / 1000) + 's mein dobara try…');
  clearTimeout(peerTimer); peerTimer = setTimeout(initializePeer, wait);
}
function initializePeer(){
  clearTimeout(peerTimer);
  if (!window.Peer){
    setPeerId('PeerJS load ho raha hai…');
    loadPeerLib(0, ok => ok ? initializePeer() : retryPeer('PeerJS load nahi hua, internet check karo'));
    return;
  }
  if (peer && !peer.destroyed){ try { peer.destroy(); } catch(e){} }
  setPeerId('Server se connect ho raha hai…');
  let me;
  try { me = peer = new Peer({debug:1, config:ICE}); }
  catch(e){ setPeerId('Ye browser WebRTC support nahi karta, Chrome use karo'); return; }
  peerTimer = setTimeout(() => { if (me === peer && !me.open) retryPeer('Server jawab nahi de raha'); }, 12000);
  me.on('open', id => {
    clearTimeout(peerTimer); peerTry = 0; setPeerId(id);
    if (lastPeer && !(conn && conn.open)) setTimeout(reconnect, 500);
  });
  me.on('connection', c => bindConn(c));
  me.on('call', c => {
    if (call || incoming){ c.close(); return; }
    incoming = c; showCall('Friend call kar raha hai 📞', true);
    const ring = () => { beep(520,.18); beep(780,.18,.25); }; ring(); ringT = setInterval(ring, 1600);
    c.on('close', endCall);
  });
  me.on('disconnected', () => {
    if (me.destroyed || me !== peer) return;
    if (navigator.onLine) setTimeout(() => { try { if (me.disconnected && !me.destroyed) me.reconnect(); } catch(e){} }, 1500);
  });
  me.on('close', () => { if (me === peer) retryPeer('Peer band ho gaya'); });
  me.on('error', e => {
    const t = e.type;
    if (t === 'peer-unavailable'){ if (!autoTry) toast('Friend ki ID galat hai ya wo offline hai'); autoTry = false; return; }
    if (t === 'browser-incompatible'){ setPeerId('Ye browser WebRTC support nahi karta, Chrome use karo'); return; }
    if (t === 'webrtc'){ toast('WebRTC problem, dobara try karo'); return; }
    if (me.id && !me.destroyed){ setTimeout(() => { try { if (me.disconnected) me.reconnect(); } catch(x){} }, 3000); return; }
    retryPeer('Server se connect nahi ho paya (' + t + ')');
  });
}

function connectToPeer(){
  const id = $('remote-peer-id').value.trim();
  if (!id){ toast('Friend ka Peer ID daalo'); return; }
  if (!peer || !peer.open){ toast('Server se connect ho raha hai, thodi der baad try karo'); return; }
  if (id === peer.id){ toast('Ye aapki apni ID hai, friend ki ID daalo'); return; }
  autoTry = false;
  const c = peer.connect(id, {reliable:true});
  bindConn(c);
  setTimeout(() => { if (!c.open && conn === c) toast('Connect nahi hua. ID check karo, friend online hai?'); }, 12000);
}

function sendMessage(){
  const input = $('message-input'), message = input.value.trim();
  if (!message) return;
  deliver(addMessage(username, message, true));
  input.value = '';
}

function showTyping(){ $('typing').classList.add('on'); clearTimeout(typingTimer); typingTimer = setTimeout(hideTyping, 1800); $('messages').scrollTop = 1e9; }
function hideTyping(){ $('typing').classList.remove('on'); }

$('message-input').addEventListener('keydown', e => { if (e.key === 'Enter') sendMessage(); });
$('message-input').addEventListener('input', () => {
  const now = Date.now();
  if (conn && conn.open && now - lastTypingSent > 1000){ lastTypingSent = now; conn.send({type:'typing'}); }
});
$('username').addEventListener('keydown', e => { if (e.key === 'Enter') registerUser(); });

function addMessage(sender, message, isYou, id){
  const m = {id: id || uid(), username:sender, message, timestamp:new Date().toISOString(), isYou, status: isYou ? 'queued' : 'got'};
  messages.push(m);
  localStorage.setItem('chitchat_messages', JSON.stringify(messages));
  warp = 1;
  appendMessage(m);
  reactToText(message, isYou);
  updateStatus();
  return m;
}

function appendMessage(m){
  const box = $('messages'), d = document.createElement('div');
  d.className = 'message ' + (m.isYou ? 'you' : 'peer');
  const who = document.createElement('span'); who.className = 'who'; who.textContent = m.username;
  const body = document.createElement('span'); body.textContent = m.message;
  const t = document.createElement('time'); t.textContent = new Date(m.timestamp).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
  if (m.isYou){ const k = document.createElement('span'); k.className = 'tick' + (m.status === 'delivered' ? ' d' : ''); k.textContent = TICK[m.status] || ''; t.appendChild(k); }
  d.dataset.id = m.id || '';
  d.append(who, body, t);
  box.appendChild(d);
  box.scrollTop = box.scrollHeight;
}

function renderMessages(){ $('messages').innerHTML = ''; messages.forEach(appendMessage); }

/* ---------- 3D cartoon mascot ---------- */
const mascot = $('mascot'), tilt = $('tilt');
let moodT, sayT;
const MOODS = [
  {re:/[❤💕💖😍🥰😘💗💓]|love|pyar|pyaar|miss you/iu, face:'love',  motion:'jump',   say:'Awww 😍', fx:['💖','❤️','✨']},
  {re:/[😂🤣😆😄😁]|ha(ha)+|lol|lmao/iu,              face:'laugh', motion:'wobble', say:'Hahaha! 😂', fx:['😂','🤣','😆']},
  {re:/[😮😲🤯]|wow|omg|kya baat/iu,                  face:'wow',   motion:'jump',   say:'Wow! 😮', fx:['😮','✨','⭐']},
  {re:/[😢😭😞💔]|sad|dukh|rona|sorry/iu,             face:'sad',   motion:'sad',    say:'Oh no... 😢', fx:['💧','😢']},
  {re:/[😡🤬😠]|gussa|angry/iu,                       face:'angry', motion:'shake',  say:'Grrr! 😠', fx:['💢','🔥']},
  {re:/[🔥🎉👏🥳]|congrat|badhai|party|mast/iu,       face:'',      motion:'spin',   say:'Party time! 🎉', fx:['🎉','🥳','✨']},
  {re:/\b(hi+|hello|hey|namaste)\b/iu,                face:'',      motion:'jump',   say:'Hello! 👋', fx:['👋','✨']},
  {re:/\?/,                                           face:'wow',   motion:'wobble', say:'Hmm? 🤔', fx:['🤔','❓']}
];
const FALLBACK = ['jump','spin','wobble'];

function moodFor(text){
  return MOODS.find(m => m.re.test(text)) ||
    {face:'', motion:FALLBACK[Math.floor(Math.random()*FALLBACK.length)], say:'Nice! ✨', fx:['✨','⭐']};
}
function setMood(m){
  clearTimeout(moodT);
  mascot.className = ''; void mascot.offsetWidth;
  mascot.classList.add('m-' + m.motion);
  if (m.face) mascot.classList.add(m.face);
  moodT = setTimeout(() => mascot.className = '', 2200);
}
function say(t){
  const el = $('say'); el.textContent = t;
  el.classList.remove('on'); void el.offsetWidth; el.classList.add('on');
  clearTimeout(sayT); sayT = setTimeout(() => el.classList.remove('on'), 2600);
}
function burst(list, n){
  const box = $('bursts');
  for (let i = 0; i < n; i++){
    const b = document.createElement('span');
    b.className = 'burst';
    b.textContent = list[i % list.length];
    b.style.setProperty('--dx', (Math.random()*180-90) + 'px');
    b.style.setProperty('--dy', (-50 - Math.random()*60) + 'px');
    b.style.setProperty('--dz', (Math.random()*220-40) + 'px');
    b.style.setProperty('--rot', (Math.random()*720-360) + 'deg');
    b.style.animationDelay = (i*70) + 'ms';
    box.appendChild(b);
    setTimeout(() => b.remove(), 2200 + i*70);
  }
}
function reactToText(text, mine){
  const m = moodFor(text);
  const found = text.match(/\p{Extended_Pictographic}/gu);
  setMood(m);
  burst(found && found.length ? found.slice(0,6) : m.fx, 5);
  say(mine ? m.say : 'Friend ne kuch bheja! 💬');
}
function react(emoji, mine, name, custom){
  const m = moodFor(emoji);
  setMood(m);
  burst([emoji], 6);
  say(custom || (mine ? emoji + ' ' + m.say : name + ' ne ' + emoji + ' bheja'));
}

// eyes follow the pointer, body tilts toward it
addEventListener('pointermove', e => {
  if ($('chat').style.display !== 'flex') return;
  const r = mascot.getBoundingClientRect();
  const dx = Math.max(-1, Math.min(1, (e.clientX - (r.left + r.width/2)) / 300));
  const dy = Math.max(-1, Math.min(1, (e.clientY - (r.top + r.height/2)) / 300));
  mascot.style.setProperty('--px', (dx*4) + 'px');
  mascot.style.setProperty('--py', (dy*5) + 'px');
  tilt.style.transform = `rotateY(${dx*28}deg) rotateX(${-dy*20}deg)`;
});

/* ---------- reaction emojis: tap to send, + to add, edit to remove ---------- */
let emojis;
try { emojis = JSON.parse(localStorage.getItem('somochat_emojis')); } catch(e){}
if (!Array.isArray(emojis) || !emojis.length) emojis = ['❤️','😂','😮','🔥','👏','😢'];
let editMode = false;

function saveEmojis(){ localStorage.setItem('somochat_emojis', JSON.stringify(emojis)); }
function renderEmojis(){
  const bar = $('emojis'); bar.innerHTML = '';
  bar.classList.toggle('edit', editMode);
  emojis.forEach((e, i) => {
    const b = document.createElement('button');
    b.className = 'em'; b.textContent = e; b.title = editMode ? 'Remove' : 'React';
    b.onclick = () => {
      if (editMode){ emojis.splice(i, 1); saveEmojis(); renderEmojis(); return; }
      react(e, true, username);
      if (conn && conn.open) conn.send({type:'react', emoji:e, username});
    };
    bar.appendChild(b);
  });
  const add = document.createElement('button');
  add.className = 'em tool'; add.textContent = '+'; add.title = 'Add emoji'; add.onclick = addEmoji;
  const ed = document.createElement('button');
  ed.className = 'em tool'; ed.textContent = editMode ? 'Done' : 'Edit'; ed.onclick = () => { editMode = !editMode; renderEmojis(); };
  bar.append(add, ed);
}
function addEmoji(){
  const v = prompt('Naya emoji daalo (ek ya zyada)');
  if (!v) return;
  const parts = window.Intl && Intl.Segmenter ? [...new Intl.Segmenter(undefined, {granularity:'grapheme'}).segment(v)].map(s => s.segment) : Array.from(v);
  let added = 0;
  parts.forEach(g => {
    if (/\p{Extended_Pictographic}/u.test(g) && !emojis.includes(g) && emojis.length < 16){ emojis.push(g); added++; }
  });
  if (!added) toast('Koi naya emoji nahi mila');
  saveEmojis(); renderEmojis();
}
renderEmojis();

/* ---------- offline queue, delivery ticks, auto-reconnect, same-device tabs ---------- */
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const TICK = {queued:'⏳', sent:'✓', delivered:'✓✓'};
const tab = uid(), seen = new Set();
let lastPeer = '', lastTry = 0, autoTry = false;
const bc = 'BroadcastChannel' in window ? new BroadcastChannel('somochat') : null;
if (bc) bc.onmessage = e => {
  const d = e.data;
  if (!d || d.tab === tab || !username) return;
  if (d.type === 'ack'){ setStatus(d.id, 'delivered'); return; }
  if (d.message) gotMessage(d, id => bc.postMessage({type:'ack', id, tab}));
};
function setStatus(id, st){
  const m = messages.find(x => x.id === id);
  if (!m || m.status === 'delivered') return;
  m.status = st;
  const k = document.querySelector('[data-id="' + id + '"] .tick');
  if (k){ k.textContent = TICK[st]; k.classList.toggle('d', st === 'delivered'); }
  updateStatus();
}
function deliver(m, fromQueue){
  if (conn && conn.open){ conn.send({username:m.username, message:m.message, id:m.id}); if (m.status === 'queued') setStatus(m.id, 'sent'); }
  if (bc && !fromQueue) bc.postMessage({username:m.username, message:m.message, id:m.id, tab});
}
function flushQueue(){
  const q = messages.filter(m => m.isYou && m.status === 'queued');
  q.forEach(m => deliver(m, true));
  if (q.length) toast(q.length + ' pending message bhej diye');
}
function gotMessage(d, ack){
  if (!d.id){ addMessage(d.username, d.message, false); return; }
  if (ack) ack(d.id);
  if (seen.has(d.id)) return;
  seen.add(d.id);
  addMessage(d.username, d.message, false, d.id);
  beep();
  try { if (document.hidden && window.Notification && Notification.permission === 'granted') new Notification(d.username, {body:d.message}); } catch(e){}
}
function reconnect(){
  if (!peer || peer.destroyed || !lastPeer || (conn && conn.open) || Date.now() - lastTry < 7000) return;
  lastTry = Date.now(); autoTry = true;
  if (peer.disconnected) peer.reconnect(); else bindConn(peer.connect(lastPeer));
}
setInterval(() => { if (navigator.onLine) reconnect(); }, 8000);
addEventListener('online', () => { updateStatus(); toast('Wapas online'); setTimeout(reconnect, 600); });
addEventListener('offline', () => { updateStatus(); toast('Offline: messages queue honge'); });
function clearChat(){ messages = []; localStorage.removeItem('chitchat_messages'); renderMessages(); updateStatus(); toast('Chat clear ho gayi'); }

let ac;
function beep(f = 660, d = .12, t = 0){
  try { ac = ac || new AudioContext(); const o = ac.createOscillator(), g = ac.createGain(); o.frequency.value = f; g.gain.value = .05; o.connect(g); g.connect(ac.destination); o.start(ac.currentTime + t); o.stop(ac.currentTime + t + d); } catch(e){}
}

/* ---------- voice call (mic -> friend), mascot lip-syncs to friend's voice ---------- */
let call, incoming, localStream, callT, ringT, callAt, muted = false, meterOn = false;
const remote = new Audio(); remote.autoplay = true;
function showCall(txt, answer){
  $('callbar').classList.add('on'); $('calltxt').textContent = txt;
  $('ansbtn').style.display = answer ? '' : 'none'; $('mutebtn').style.display = answer ? 'none' : '';
}
async function mic(){ localStream = await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true, noiseSuppression:true}}); }
async function startCall(){
  if (call || incoming){ endCall(); return; }
  if (!conn || !conn.open){ toast('Pehle friend se link karo'); return; }
  try { await mic(); } catch(e){ toast('Mic ki permission do'); return; }
  setCall(peer.call(conn.peer, localStream)); showCall('Calling…', false);
}
async function answerCall(){
  clearInterval(ringT);
  try { await mic(); } catch(e){ toast('Mic ki permission do'); endCall(); return; }
  const c = incoming; incoming = null;
  c.answer(localStream); setCall(c); showCall('Connecting…', false);
}
function setCall(c){
  call = c;
  c.on('stream', s => {
    remote.srcObject = s; remote.play().catch(() => {});
    callAt = Date.now(); tickCall(); callT = setInterval(tickCall, 1000);
    meter(s); say('Voice call chalu 🎙️');
  });
  c.on('close', endCall); c.on('error', endCall);
}
function tickCall(){
  const t = Math.floor((Date.now() - callAt) / 1000);
  $('calltxt').textContent = '🎙️ Voice call · ' + String(Math.floor(t / 60)).padStart(2, '0') + ':' + String(t % 60).padStart(2, '0');
}
function endCall(){
  clearInterval(ringT); clearInterval(callT); meterOn = false;
  const c = call, i = incoming; call = incoming = null;
  try { c && c.close(); i && i.close(); } catch(e){}
  if (localStream){ localStream.getTracks().forEach(t => t.stop()); localStream = null; }
  remote.srcObject = null; muted = false; $('mutebtn').textContent = 'Mute';
  $('callbar').classList.remove('on'); mascot.style.setProperty('--talk', 0);
}
function toggleMute(){
  muted = !muted;
  if (localStream) localStream.getAudioTracks().forEach(t => t.enabled = !muted);
  $('mutebtn').textContent = muted ? 'Unmute' : 'Mute';
}
function meter(s){
  try {
    ac = ac || new AudioContext(); ac.resume();
    const a = ac.createAnalyser(); a.fftSize = 256;
    ac.createMediaStreamSource(s).connect(a);
    const buf = new Uint8Array(a.frequencyBinCount); meterOn = true;
    (function loop(){
      if (!meterOn) return;
      a.getByteFrequencyData(buf);
      let v = 0; for (const x of buf) v += x;
      mascot.style.setProperty('--talk', Math.min(1, v / buf.length / 70).toFixed(2));
      requestAnimationFrame(loop);
    })();
  } catch(e){}
}
